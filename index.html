    <script>
      // Homepage only: preload the one hero this device will show, and hold the headline
      // lines until the entrance timeline takes over. The timer reveals them if animation
      // never starts. Buttons and navigation are never hidden.
      if (location.pathname === '/') {
        var heroes = [['(min-width: 768px)', '/images/hero-desktop-960.webp 960w, /images/hero-desktop-1536.webp 1536w'], ['(max-width: 767px)', '/images/hero-mobile-480.webp 480w, /images/hero-mobile-800.webp 800w']]
        heroes.forEach(function (hero) {
          var link = document.createElement('link')
          link.rel = 'preload'; link.as = 'image'; link.media = hero[0]; link.setAttribute('imagesrcset', hero[1]); link.setAttribute('imagesizes', '100vw'); link.setAttribute('fetchpriority', 'high')
          document.head.appendChild(link)
        })
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('hero-pending')
          setTimeout(function () { document.documentElement.classList.remove('hero-pending') }, 2500)
        }
      }
    </script>
